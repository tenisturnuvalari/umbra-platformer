<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>UMBRA — gölge fazı platformer</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }

  body {
    background: linear-gradient(180deg, #3a4148 0%, #1b2026 46%, #0a0c0f 100%);
    color: #e8ecf1;
    font: 500 14px/1.4 ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  #game, #game canvas { position: fixed; inset: 0; display: block; }

  /* film grain — gorsel doku, oyun motoruna dokunmaz */
  #grain {
    position: fixed; inset: -60%; pointer-events: none; opacity: .15; z-index: 5;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>");
    animation: grain 1.1s steps(3) infinite;
  }
  @keyframes grain {
    0%   { transform: translate(0, 0); }
    33%  { transform: translate(-2%, 1%); }
    66%  { transform: translate(1%, -2%); }
    100% { transform: translate(0, 0); }
  }

  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 6;
    background: radial-gradient(ellipse at 50% 45%, transparent 34%, rgba(0,0,0,.74) 100%);
  }

  #hud {
    position: fixed; inset: 0; z-index: 7; pointer-events: none;
    padding: 18px 22px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }

  .chip {
    padding: 6px 12px; border: 1px solid rgba(255,255,255,.18);
    background: rgba(0,0,0,.42); backdrop-filter: blur(6px);
    letter-spacing: .14em; text-transform: uppercase; font-size: 11px;
    transition: color .2s, border-color .2s, box-shadow .2s;
  }
  #level-name { max-width: 46ch; }
  #phase[data-phase="light"]  { color:#f0a03c; border-color:#f0a03c; box-shadow: 0 0 20px rgba(240,160,60,.28) inset; }
  #phase[data-phase="shadow"] { color:#4fd6ff; border-color:#4fd6ff; box-shadow: 0 0 20px rgba(79,214,255,.28) inset; }

  #hint { align-self: center; text-align: center; opacity: .72; font-size: 12px; letter-spacing: .06em; min-height: 1.4em; }

  #flash {
    position: fixed; inset: 0; z-index: 8; pointer-events: none;
    background: #fff; opacity: 0; mix-blend-mode: overlay; transition: opacity .5s ease;
  }
  #flash.on { opacity: .6; transition: opacity .04s; }
</style>

<script type="importmap">
{
  "imports": {
    "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8/dist/pixi.min.mjs"
  }
}
</script>
</head>
<body>
  <div id="game"></div>
  <div id="grain"></div>
  <div id="vignette"></div>

  <div id="hud">
    <div class="row">
      <div class="chip" id="level-name">UMBRA</div>
      <div class="chip" id="phase" data-phase="light">Faz · Işık</div>
    </div>
    <div class="row">
      <div class="chip" id="keys">← → hareket · SPACE zıpla · SHIFT faz değiştir · R yeniden</div>
      <div class="chip" id="deaths">0</div>
    </div>
    <div id="hint"></div>
  </div>

  <div id="flash"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
